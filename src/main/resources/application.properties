spring.application.name=mini-redis
server.port=${PORT:8080}
server.forward-headers-strategy=framework

app.cache.max-size=${CACHE_MAX_SIZE:1000}
app.cache.history-size=${CACHE_HISTORY_SIZE:20}
app.cache.persistence-file=${CACHE_PERSISTENCE_FILE:./data/mini-redis-cache.dat}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Mini Redis
info.app.description=In-memory cache dashboard API

springdoc.swagger-ui.path=/swagger-ui.html
logging.level.com.sakshi.miniredis=INFO
